<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="denseForest2014" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#1e3a1e" />
    </radialGradient>
    <pattern id="leafTexture" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="4" fill="#15803d" opacity="0.6" />
      <circle cx="15" cy="15" r="5" fill="#166534" opacity="0.7" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#denseForest2014)" />
  <rect width="800" height="500" fill="url(#leafTexture)" opacity="0.5" />

  <!-- Sinhagad Ridge Crest (Basalt Escarpment) -->
  <path d="M 120 180 Q 280 240 440 210 Q 600 180 720 260" fill="none" stroke="#44403c" stroke-width="26" stroke-linecap="round" />
  <path d="M 120 180 Q 280 240 440 210 Q 600 180 720 260" fill="none" stroke="#78716c" stroke-width="14" stroke-linecap="round" />

  <!-- Moist Ravine / Nullahs (Spring seepage) -->
  <path d="M 300 240 Q 260 360 220 500" fill="none" stroke="#059669" stroke-width="12" />
  <path d="M 540 200 Q 560 320 600 500" fill="none" stroke="#059669" stroke-width="14" />
  <path d="M 430 210 Q 420 120 400 0" fill="none" stroke="#059669" stroke-width="10" />

  <!-- Narrow Old Access Road (Single lane) -->
  <path d="M 100 480 C 180 440 120 380 220 340 S 320 360 380 300 S 340 240 420 220" fill="none" stroke="#a8a29e" stroke-width="4" stroke-dasharray="8,3" />

  <!-- Historic Summit Fort Plateau -->
  <ellipse cx="440" cy="210" rx="60" ry="25" fill="#57534e" opacity="0.8" stroke="#292524" stroke-width="3" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="320" height="90" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8">LANDSAT-8 NIR FALSE-COLOR BAND</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Sinhagad Spur & Ravines [18.366°N, 73.755°E]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">Acquisition: NOV 2014 (Post-Monsoon)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Canopy Density (NDVI): 0.76 | Road Corridor: 6m wide</text>

  <!-- Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">1.0 km</text>
</svg>
