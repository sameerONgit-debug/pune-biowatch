<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="degradedForest2024" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3f6212" />
      <stop offset="50%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>
    <pattern id="dryPatch" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#78716c" opacity="0.3" />
      <circle cx="10" cy="10" r="6" fill="#a8a29e" opacity="0.5" />
      <circle cx="25" cy="22" r="5" fill="#ca8a04" opacity="0.4" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#degradedForest2024)" />
  <rect width="800" height="500" fill="url(#dryPatch)" />

  <!-- Desiccated brown patches along southwestern slopes -->
  <path d="M 0 350 Q 150 280 260 400 Q 140 500 0 500 Z" fill="#92400e" opacity="0.6" />
  <path d="M 500 320 Q 640 260 760 380 Q 700 500 520 480 Z" fill="#92400e" opacity="0.55" />

  <!-- Sinhagad Ridge Crest -->
  <path d="M 120 180 Q 280 240 440 210 Q 600 180 720 260" fill="none" stroke="#44403c" stroke-width="26" stroke-linecap="round" />
  <path d="M 120 180 Q 280 240 440 210 Q 600 180 720 260" fill="none" stroke="#78716c" stroke-width="14" stroke-linecap="round" />

  <!-- Shrunk Ravine seepages -->
  <path d="M 300 240 Q 260 360 220 500" fill="none" stroke="#65a30d" stroke-width="6" stroke-dasharray="14,6" />
  <path d="M 540 200 Q 560 320 600 500" fill="none" stroke="#65a30d" stroke-width="7" stroke-dasharray="10,5" />

  <!-- Heavy Asphalt Ghat Road & Concrete Retaining Walls (Widened) -->
  <path d="M 100 480 C 180 440 120 380 220 340 S 320 360 380 300 S 340 240 420 220" fill="none" stroke="#1c1917" stroke-width="16" />
  <path d="M 100 480 C 180 440 120 380 220 340 S 320 360 380 300 S 340 240 420 220" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="8,8" />

  <!-- Expanded Tourist Parking Plateau & Concrete Stalls -->
  <polygon points="380,200 490,190 510,230 400,240" fill="#e2e8f0" stroke="#64748b" stroke-width="3" />
  <rect x="420" y="245" width="60" height="25" fill="#f87171" opacity="0.7" />

  <!-- Landslide / Soil cut scars -->
  <path d="M 230 350 L 260 380 L 250 410" stroke="#f59e0b" stroke-width="6" fill="none" />
  <path d="M 360 310 L 390 340 L 375 365" stroke="#f59e0b" stroke-width="6" fill="none" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="320" height="90" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#dc2626" stroke-width="1.5" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#f87171">LANDSAT-9 NIR MULTISPECTRAL</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Sinhagad Spur & Ravines [18.366°N, 73.755°E]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">Acquisition: NOV 2024 (10-Yr Revisit)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef08a">Canopy Density (NDVI): 0.58 (-23.7%) | Road Cut: 18m wide</text>

  <!-- Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">1.0 km</text>
</svg>
