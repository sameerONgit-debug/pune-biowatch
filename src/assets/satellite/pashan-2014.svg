<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pashanWater2014" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="greenMarsh2014" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </radialGradient>
    <pattern id="farmland2014" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#78716c" />
      <rect width="38" height="38" fill="#4d7c0f" opacity="0.8" />
      <line x1="0" y1="20" x2="40" y2="20" stroke="#a8a29e" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background / Surrounding Rural Land 2014 -->
  <rect width="800" height="500" fill="#475569" />
  <rect width="800" height="500" fill="url(#farmland2014)" opacity="0.65" />

  <!-- Catchment Hill contours -->
  <path d="M 0 0 Q 250 80 400 30 Q 600 -10 800 70 L 800 0 Z" fill="#14532d" opacity="0.7" />
  <path d="M 0 500 Q 200 420 500 460 Q 700 490 800 430 L 800 500 Z" fill="#166534" opacity="0.75" />

  <!-- Ramnadi River Inflow (Clean Blue Ribbon) -->
  <path d="M 50 180 C 140 190 220 220 300 240" fill="none" stroke="#0284c7" stroke-width="22" stroke-linecap="round" />
  <path d="M 50 180 C 140 190 220 220 300 240" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />

  <!-- Pashan Lake Waterbody (Clean, expansive open water in 2014) -->
  <path d="M 280 220 C 320 160 440 140 560 180 C 660 210 710 280 670 340 C 620 400 480 390 380 360 C 290 330 250 270 280 220 Z" fill="url(#pashanWater2014)" stroke="#0369a1" stroke-width="4" />

  <!-- Riparian Reedbed / Mudflats -->
  <path d="M 300 220 C 350 190 410 180 450 200 C 430 230 360 240 300 220 Z" fill="#15803d" opacity="0.6" />
  <path d="M 580 340 C 640 330 670 310 650 350 C 610 380 550 370 580 340 Z" fill="#16a34a" opacity="0.5" />

  <!-- Sparse 2014 Village Settlements -->
  <circle cx="160" cy="120" r="15" fill="#e2e8f0" opacity="0.5" />
  <circle cx="690" cy="140" r="22" fill="#e2e8f0" opacity="0.5" />
  <circle cx="680" cy="420" r="18" fill="#e2e8f0" opacity="0.5" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="310" height="90" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8">SENTINEL-2 / LANDSAT-8 COMPOSITE</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Location: Pashan Lake, Pune [18.534°N, 73.784°E]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">Acquisition: OCT 2014 (Post-Monsoon)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Open Water Coverage: 84.6% | Water Hyacinth: 4.2%</text>

  <!-- Compass / Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">500 m</text>
</svg>
