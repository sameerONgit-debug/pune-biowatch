<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pashanWater2024" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="60%" stop-color="#155e75" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <pattern id="urbanGrid2024" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#64748b" />
      <rect x="2" y="2" width="12" height="12" fill="#cbd5e1" stroke="#475569" stroke-width="1" />
      <rect x="16" y="2" width="12" height="12" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      <rect x="2" y="16" width="12" height="12" fill="#94a3b8" stroke="#475569" stroke-width="1" />
      <rect x="16" y="16" width="12" height="12" fill="#e2e8f0" stroke="#475569" stroke-width="1" />
      <line x1="0" y1="0" x2="30" y2="0" stroke="#334155" stroke-width="2" />
      <line x1="0" y1="0" x2="0" y2="30" stroke="#334155" stroke-width="2" />
    </pattern>
    <pattern id="hyacinthMat" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#84cc16" />
      <circle cx="8" cy="8" r="5" fill="#65a30d" />
      <circle cx="2" cy="2" r="3" fill="#a3e635" />
    </pattern>
  </defs>

  <!-- Background / Dense Urban Encroachment 2024 -->
  <rect width="800" height="500" fill="url(#urbanGrid2024)" />

  <!-- Construction and asphalt corridors -->
  <path d="M 0 110 Q 300 130 800 100" stroke="#334155" stroke-width="24" fill="none" />
  <path d="M 0 420 Q 400 390 800 440" stroke="#334155" stroke-width="30" fill="none" />
  <path d="M 520 0 L 580 500" stroke="#334155" stroke-width="18" fill="none" />

  <!-- Silt plume & Inflow -->
  <path d="M 50 180 C 140 190 220 220 300 240" fill="none" stroke="#78716c" stroke-width="24" stroke-linecap="round" />
  <path d="M 50 180 C 140 190 220 220 300 240" fill="none" stroke="#a8a29e" stroke-width="12" stroke-linecap="round" />

  <!-- Pashan Lake Waterbody (Shrunk and fragmented in 2024) -->
  <path d="M 310 230 C 340 190 430 170 530 200 C 620 220 660 270 630 320 C 590 370 470 360 390 340 C 320 320 290 270 310 230 Z" fill="url(#pashanWater2024)" stroke="#0f172a" stroke-width="3" />

  <!-- Massive Invasive Water Hyacinth (Eichhornia crassipes) Mats covering 60% -->
  <path d="M 310 230 C 370 200 440 210 490 250 C 470 290 410 320 340 300 C 300 270 300 240 310 230 Z" fill="url(#hyacinthMat)" opacity="0.95" stroke="#4d7c0f" stroke-width="2" />
  <path d="M 530 200 C 580 210 630 240 620 280 C 590 300 550 280 530 240 Z" fill="url(#hyacinthMat)" opacity="0.9" stroke="#4d7c0f" stroke-width="2" />
  <path d="M 440 320 C 520 340 580 340 590 310 C 560 330 480 340 440 320 Z" fill="url(#hyacinthMat)" opacity="0.92" stroke="#4d7c0f" stroke-width="2" />

  <!-- Silt bank / mud deposit -->
  <path d="M 270 220 C 330 240 370 270 330 290 C 290 280 260 250 270 220 Z" fill="#a8a29e" stroke="#78716c" stroke-width="2" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="310" height="90" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#dc2626" stroke-width="1.5" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#f87171">SENTINEL-2 / HIGH-RES ENVI COMPOSITE</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Location: Pashan Lake, Pune [18.534°N, 73.784°E]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">Acquisition: OCT 2024 (10-Yr Revisit)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef08a">Open Water: 36.2% (-48.4%) | Hyacinth: 58.7% (+54.5%)</text>

  <!-- Compass / Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">500 m</text>
</svg>
