<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="concreteDense2024" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#475569" />
      <rect x="2" y="2" width="10" height="10" fill="#94a3b8" />
      <rect x="13" y="2" width="10" height="10" fill="#cbd5e1" />
      <rect x="2" y="13" width="10" height="10" fill="#cbd5e1" />
      <rect x="13" y="13" width="10" height="10" fill="#64748b" />
      <line x1="0" y1="0" x2="25" y2="0" stroke="#1e293b" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="25" stroke="#1e293b" stroke-width="1.5" />
    </pattern>
    <!-- Urban Heat Island Thermal Anomaly Glow -->
    <radialGradient id="heatDome" cx="45%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#eab308" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Dense Concrete Grid Base 2024 -->
  <rect width="800" height="500" fill="url(#concreteDense2024)" />

  <!-- Expressways & Ring Roads -->
  <path d="M 120 0 L 380 500" stroke="#0f172a" stroke-width="20" fill="none" />
  <path d="M 0 160 L 800 210" stroke="#0f172a" stroke-width="18" fill="none" />
  <path d="M 280 0 Q 420 300 800 380" stroke="#0f172a" stroke-width="16" fill="none" />

  <!-- Constricted Mula River (Darker, warmer water) -->
  <path d="M 0 260 C 200 240 300 320 500 280 S 700 220 800 240" fill="none" stroke="#0369a1" stroke-width="18" stroke-linecap="round" />
  <path d="M 0 260 C 200 240 300 320 500 280 S 700 220 800 240" fill="none" stroke="#0891b2" stroke-width="8" stroke-linecap="round" />

  <!-- Remaining Fragmented SPPU Green Pocket -->
  <circle cx="480" cy="180" r="48" fill="#15803d" opacity="0.8" stroke="#14532d" stroke-width="3" />

  <!-- Hinjawadi Tech Parks / High-rises -->
  <rect x="50" y="80" width="130" height="110" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <rect x="190" y="240" width="150" height="140" fill="#334155" stroke="#94a3b8" stroke-width="2" />
  <rect x="580" y="280" width="170" height="160" fill="#334155" stroke="#94a3b8" stroke-width="2" />

  <!-- Urban Heat Island Thermal Overlay -->
  <rect width="800" height="500" fill="url(#heatDome)" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="330" height="90" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#dc2626" stroke-width="1.5" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#f87171">LANDSAT-9 TIRS THERMAL ANOMALY</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Pune NW Corridor (Baner-Hinjawadi) [18.57°N]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">Acquisition: MAR 2024 (14-Yr Revisit)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef08a">Built-up: 78.4% (+54.3%) | Mean Surface Temp: 42.8°C (+8.6°C)</text>

  <!-- Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">2.5 km</text>
</svg>
