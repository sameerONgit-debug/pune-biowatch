  <rect x="20" y="20" width="320" height="90" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8">SENTINEL-2 MULTISPECTRAL NDRE</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Mulshi Catchment & Ghats [18.503°N, 73.513°E]</text>
