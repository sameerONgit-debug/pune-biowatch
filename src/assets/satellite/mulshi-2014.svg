  <path d="M 100 240 C 220 180 340 160 480 200 C 600 240 720 220 800 180 L 800 320 C 700 360 580 340 460 300 C 320 260 200 340 100 240 Z" fill="url(#mulshiDeepWater2014)" stroke="#38bdf8" stroke-width="3" />

