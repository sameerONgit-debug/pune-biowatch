<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mulshiWater2024" cx="40%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </radialGradient>
    <pattern id="resortPlots" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#047857" />
      <rect x="4" y="4" width="10" height="10" fill="#fde047" opacity="0.8" />
      <rect x="18" y="16" width="8" height="8" fill="#cbd5e1" />
      <circle cx="12" cy="22" r="3" fill="#38bdf8" />
    </pattern>
  </defs>

  <!-- Fragmented Forest Backdrop -->
  <rect width="800" height="500" fill="#064e3b" />

  <!-- Mountain Ridges with clearing patches -->
  <path d="M 0 0 Q 300 120 500 40 Q 650 0 800 80 L 800 0 Z" fill="#047857" opacity="0.7" />
  <path d="M 0 500 Q 250 380 500 440 Q 680 480 800 400 L 800 500 Z" fill="#047857" opacity="0.75" />

  <!-- Silt / Eroded Shoreline Buffer (Exposed dry mud due to rapid drawdown) -->
  <path d="M 90 235 C 210 170 330 150 480 190 C 610 230 730 210 800 170 L 800 335 C 690 375 570 355 450 310 C 310 270 190 355 90 235 Z" fill="#a8a29e" stroke="#78716c" stroke-width="2" />

  <!-- Contracted Mulshi Reservoir Water Body 2024 -->
  <path d="M 120 245 C 230 190 340 175 470 210 C 590 245 710 230 800 195 L 800 305 C 700 345 580 325 460 290 C 330 255 210 325 120 245 Z" fill="url(#mulshiWater2024)" stroke="#38bdf8" stroke-width="2" />

  <!-- Resort Construction Cutouts & Lakeside Road Strip -->
  <path d="M 60 200 Q 300 130 540 170 Q 700 190 800 140" stroke="#d97706" stroke-width="8" fill="none" />
  <rect x="240" y="120" width="70" height="40" fill="url(#resortPlots)" stroke="#ca8a04" stroke-width="2" />
  <rect x="490" y="140" width="90" height="50" fill="url(#resortPlots)" stroke="#ca8a04" stroke-width="2" />
  <rect x="340" y="320" width="80" height="45" fill="url(#resortPlots)" stroke="#ca8a04" stroke-width="2" />

  <!-- Slope Landslip Scar from Torrential Rain -->
  <polygon points="170,80 190,140 160,180 150,110" fill="#b45309" opacity="0.85" />
  <polygon points="660,70 685,130 655,170" fill="#b45309" opacity="0.85" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="320" height="90" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#dc2626" stroke-width="1.5" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#f87171">SENTINEL-2 MULTISPECTRAL NDRE</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Mulshi Catchment & Ghats [18.503°N, 73.513°E]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">Acquisition: OCT 2024 (10-Yr Revisit)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fef08a">Water Area: 36.8 km² (-16.7%) | Eroded Rim: +31.4%</text>

  <!-- Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">2.0 km</text>
</svg>
