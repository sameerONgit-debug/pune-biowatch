<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="ruralPlots2010" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#65a30d" opacity="0.6" />
      <rect x="2" y="2" width="26" height="26" fill="#84cc16" opacity="0.7" />
      <rect x="32" y="2" width="26" height="26" fill="#ca8a04" opacity="0.4" />
      <rect x="2" y="32" width="26" height="26" fill="#4d7c0f" opacity="0.8" />
      <rect x="32" y="32" width="26" height="26" fill="#a16207" opacity="0.5" />
      <line x1="0" y1="30" x2="60" y2="30" stroke="#fef08a" stroke-width="1" />
      <line x1="30" y1="0" x2="30" y2="60" stroke="#fef08a" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#ruralPlots2010)" />

  <!-- Mula River Meander -->
  <path d="M 0 260 C 200 240 300 320 500 280 S 700 220 800 240" fill="none" stroke="#0284c7" stroke-width="26" stroke-linecap="round" />
  <path d="M 0 260 C 200 240 300 320 500 280 S 700 220 800 240" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" />

  <!-- Pune University & Aundh Green Woods -->
  <circle cx="480" cy="180" r="70" fill="#14532d" opacity="0.85" />
  <circle cx="560" cy="150" r="50" fill="#166534" opacity="0.8" />

  <!-- Moderate 2010 Urban cluster (Aundh/Shivajinagar) -->
  <rect x="520" y="240" width="180" height="150" rx="8" fill="#64748b" opacity="0.65" stroke="#475569" stroke-width="2" />
  <rect x="180" y="100" width="70" height="60" rx="4" fill="#64748b" opacity="0.5" />

  <!-- Mumbai-Pune Highway (Old NH4) -->
  <path d="M 120 0 L 380 500" stroke="#334155" stroke-width="10" fill="none" />

  <!-- Scientific Metadata Overlay -->
  <rect x="20" y="20" width="330" height="90" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#38bdf8">LANDSAT-7 THERMAL INFRARED</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f8fafc">Pune NW Corridor (Baner-Hinjawadi) [18.57°N]</text>
  <text x="35" y="82" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80">Acquisition: MAR 2010 (Pre-Monsoon)</text>
  <text x="35" y="98" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">Built-up Surface: 24.1% | Mean Surface Temp: 34.2°C</text>

  <!-- Scale -->
  <rect x="700" y="20" width="75" height="48" rx="6" fill="#0f172a" fill-opacity="0.85" />
  <text x="730" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">▲ N</text>
  <text x="715" y="58" font-family="monospace" font-size="10" fill="#94a3b8">2.5 km</text>
</svg>
